# .github/workflows/build-prebuilt-image.yml
# PHẢI nằm ở GỐC repo. GitHub Actions chỉ đọc .github/workflows/ ở gốc — workflow trong
# motions-studio/.github/ là file chết, chưa từng chạy lần nào.
name: Build prebuilt pod image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      # Image bake dependency của api, worker và bg-remover — ba file requirements đó đổi là
      # image lệch code. Theo dõi cả ba, không chỉ Dockerfile.
      - motions-studio/worker-image/Dockerfile
      - motions-studio/api/package.json
      - motions-studio/worker/requirements.txt
      - motions-studio/bg-remover/requirements.txt
      - .github/workflows/build-prebuilt-image.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: prebuilt-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Runner tiêu chuẩn chỉ còn ~14GB trống; image này vài chục GB sau khi giải nén.
      - name: Dọn disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          # repository_owner, không gõ cứng: ai fork cũng build vào registry của mình.
          images: ghcr.io/${{ github.repository_owner }}/motion-prebuilt
          tags: |
            # enable= guard: build thử gần như chắc chắn chạy bằng workflow_dispatch trên một
            # nhánh, không phải push vào main. Không có guard này thì lần chạy thử ĐÓ ghi đè
            # `latest` bằng image dựng từ code chưa merge.
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: motions-studio
          file: motions-studio/worker-image/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Dung lượng image ban đầu được coi là rủi ro lớn nhất — đo thật trên pod RunPod (06/08/2026)
      # đã bác điều đó: image 16,20 GB pull xong trong ~3 phút (băng thông nội bộ datacenter), và
      # `df -h /` trên pod báo 401M/100G vì layer image nằm ở tầng đọc-riêng (read-only) của
      # overlayfs — chỉ tầng ghi (writable) mới tính vào quota container disk DISK=100. In số ra
      # vẫn hữu ích để bắt lỗi đo (xem ngưỡng dưới), chỉ bỏ kết luận "pull chậm/DISK không đủ".
      - name: In dung lượng image
        run: |
          OWNER="${{ github.repository_owner }}"
          # Hạ chữ thường: chủ repo có chữ hoa (vd "ThucPham") thì ghcr.io từ chối path chữ hoa —
          # metadata-action ở bước build đã tự hạ, nhưng REF ghép tay ở đây thì không.
          OWNER="${OWNER,,}"
          REF="ghcr.io/${OWNER}/motion-prebuilt:sha-${GITHUB_SHA::7}"
          # --raw trả OCI image index (khoá `manifests`), KHÔNG phải image đơn (khoá `layers`).
          # Đọc thẳng `layers` ở tầng này luôn ra 0 GB và bước vẫn xanh — thành công giả.
          # Phải lấy digest amd64 trước, rồi mới cộng layer của chính manifest đó.
          D=$(docker buildx imagetools inspect "$REF" --raw \
            | python3 -c 'import json,sys; m=json.load(sys.stdin); print([x["digest"] for x in m["manifests"] if x.get("platform",{}).get("architecture")=="amd64"][0])')
          docker buildx imagetools inspect "ghcr.io/${OWNER}/motion-prebuilt@$D" --raw \
            | python3 -c 'import json,sys
          m=json.load(sys.stdin); ls=m["layers"]
          gb=sum(l["size"] for l in ls)/2**30
          print("số layer:", len(ls))
          print("TỔNG NÉN: %.2f GB" % gb)
          print("Đo thật trên pod RunPod (06/08/2026, image 16,20 GB): pull ~3 phút, df / báo 401M/100G — layer image ở tầng read-only overlayfs, không tính vào quota container disk.")
          if gb < 5 or len(ls) < 10:
              # Cổng chặn: lấy nhầm manifest attestation cho ra vài MB / 1-2 layer, in ra vẫn "hợp lệ".
              # Image này không bao giờ nhỏ hơn base runpod/pytorch (~9,8 GB, 35 layer), nên số dưới
              # ngưỡng này nghĩa là ĐO SAI, không phải image nhẹ. Thà đỏ còn hơn cho ra số không tin được.
              sys.exit("ĐO SAI: %.2f GB / %d layer — dưới sàn hợp lý, nhiều khả năng đọc nhầm manifest attestation" % (gb, len(ls)))'
