# .github/workflows/build-serverless-image.yml
# PHẢI nằm ở GỐC repo. GitHub Actions chỉ đọc .github/workflows/ ở gốc — workflow trong
# motions-studio/.github/ và motions/.github/ là file chết, chưa từng chạy lần nào.
name: Build serverless image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      # Bao cả cây worker/, không chỉ ba file: Dockerfile làm `COPY worker /app/worker` nên
      # requirements.txt hay worker_runtime/ đổi là image đổi. Chỉ theo dõi ba file thì tag
      # trên GHCR lệch khỏi code mà không ai biết.
      - motions-studio/worker/**
      - .github/workflows/build-serverless-image.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: serverless-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # fail-fast: false — bản full hỏng thì bản motion (đang chạy production) vẫn phải build ra.
      # Để mặc định true thì một bản đỏ huỷ luôn bản kia, và ta mất cả hai vì một lỗi của một.
      fail-fast: false
      matrix:
        include:
          # suffix rỗng = bản mặc định, giữ nguyên tag `latest` mà endpoint hiện tại đang pull.
          - profile: motion
            suffix: ""
          - profile: full
            suffix: "-full"
    name: build (${{ matrix.profile }})
    steps:
      - uses: actions/checkout@v7

      # Runner tiêu chuẩn chỉ còn ~14GB trống; image này vài chục GB sau khi giải nén.
      - name: Dọn disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h /

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          # repository_owner, không gõ cứng: ai fork cũng build vào registry của mình.
          images: ghcr.io/${{ github.repository_owner }}/motion-serverless
          tags: |
            # enable= guard: build đầu tiên gần như chắc chắn chạy bằng workflow_dispatch trên một
            # nhánh (vd serverless-huong-a), không phải push vào main. Không có guard này thì lần
            # chạy thử ĐÓ ghi đè tag `latest` — đúng cái endpoint RunPod pull — bằng image dựng từ
            # code chưa merge, còn chưa chắc đã chạy được.
            type=raw,value=latest${{ matrix.suffix }},enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,suffix=${{ matrix.suffix }}

      - uses: docker/build-push-action@v7
        with:
          context: motions-studio
          file: motions-studio/worker/runpod/Dockerfile.selfhosted
          push: true
          # PROFILE quyết cả bộ custom node lẫn JOB_TYPES bake trong image — xem Dockerfile.
          build-args: |
            PROFILE=${{ matrix.profile }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
