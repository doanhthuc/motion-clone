# scripts/vps/telegram-bot-api.yml
# Measured 2026-08-31: this user's drivers are 1.3-15MB, so the public API's
# 20MB DOWNLOAD cap would not have bitten — an earlier claim that it would was
# never measured. The cap that binds is the 50MB UPLOAD on the way back: the
# largest video delivered so far is 41MB, and targetRes: 2k crosses it.
# A local server lifts both to 2GB AND makes getFile return an absolute path on
# disk, so the bot reads the file instead of downloading it back.
#
# TELEGRAM_API_ID / TELEGRAM_API_HASH come from https://my.telegram.org (an app
# registration, not the bot token). They must already be in
# scripts/vps/bot-api.env (gitignored) before `docker compose up` — the server
# exits immediately without them.
services:
  telegram-bot-api:
    image: ghcr.io/gramiojs/telegram-bot-api:latest
    restart: unless-stopped
    env_file: bot-api.env
    environment:
      TELEGRAM_LOCAL: "1"
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      # The two sides of this mount MUST be the identical path, however
      # inconvenient (finding C2, fixed 2026-08-31). TELEGRAM_LOCAL=1 makes
      # getFile return an absolute path on the CONTAINER's filesystem — that is
      # the whole point of running the server locally — while motion-bot.service
      # runs bot.py on the HOST. Nothing translates between the two namespaces.
      # With the previous `./telegram-bot-api-data:/var/lib/telegram-bot-api`,
      # every getFile answered /var/lib/telegram-bot-api/... , which does not
      # exist on the host, and every single file send failed with
      # "ffprobe could not read file_N.mp4". Same path both sides, no rewriting.
      #
      # The bot only ever READS from here; it copies each accepted file into
      # batch/tg-staging/ before touching it (bot.py:STAGING_DIR_NAME), so the
      # host user running bot.py needs read access to this tree but not write.
      - /var/lib/telegram-bot-api:/var/lib/telegram-bot-api
